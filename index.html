<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GRIM HALL</title>
<meta name="description" content="A Wolfenstein-style retro FPS: eighteen procedurally built halls, no external assets, playable offline.">
<meta name="theme-color" content="#0a0505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GRIM HALL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    font-family:'Courier New',monospace;user-select:none;overscroll-behavior:none;}
  /* two thumbs on the screen is a pinch to the browser unless every surface
     says otherwise: the letterbox bars and the HUD are part of the control
     area, so the whole touch page opts out of pan/zoom gestures */
  body.touch{touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  /* vh is the wrong box on mobile: the browser toolbar collapses and 100vh keeps
     lying about it. dvh tracks the live viewport, and @supports keeps old
     browsers on the vh fallback. */
  #wrap canvas{image-rendering:pixelated;image-rendering:crisp-edges;
    width:min(100vw,calc(100vh*1.6));height:min(100vw/1.6,100vh);touch-action:none;}
  @supports (height:100dvh){
    #wrap canvas{width:min(100vw,calc(100dvh*1.6));height:min(100vw/1.6,100dvh);}
  }
  /* ---- HUD status bar (wolf3d style) ---- */
  #hud{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,calc(100vh*1.6));
    height:calc(min(100vw,calc(100vh*1.6))/8);background:#1a1a1a;border-top:3px solid #444;
    display:flex;align-items:stretch;box-sizing:border-box;z-index:5;}
  @supports (height:100dvh){
    #hud{width:min(100vw,calc(100dvh*1.6));height:calc(min(100vw,calc(100dvh*1.6))/8);}
  }
  #hud.hidden{display:none;}
  .cell{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-right:2px solid #333;color:#ddd;}
  .cell:last-child{border-right:none;}
  .lbl{font-size:10px;color:#888;letter-spacing:2px;}
  button{font-family:inherit;font-size:13px;color:#ffd75e;background:#232323;border:1px solid #444;
    padding:4px 10px;cursor:pointer;}
  button:hover{background:#2e2e2e;color:#fff;}
  button.off{color:#777;}
  /* ---- touch mode: every control a thumb can actually hit ---- */
  body.touch #hud{bottom:env(safe-area-inset-bottom);touch-action:none;}
  body.touch .cell{min-width:44px;}
  body.touch button{min-width:44px;min-height:44px;font-size:12px;}
  body.touch .touchonly{display:flex;}
  body.touch .hudhide{display:none;}
  body.touch #gunCell{flex:1.6;}
  body.touch .val{font-size:18px;}
  body.touch #hGun{font-size:12px;}
  /* rarely-used switches go in the top-left corner. The bottom of the screen is
     thumb traffic: a PAUSE button next to the FIRE pad gets pressed in the panic,
     and the top corners sit outside the thumb's natural arc. */
  #sysbar{position:fixed;left:calc(env(safe-area-inset-left) + 8px);
    top:calc(env(safe-area-inset-top) + 8px);display:none;gap:8px;z-index:5;}
  body.touch #sysbar{display:flex;}
  /* left-handed play mirrors the whole layout, chrome included: the rare switches
     end up in the corner furthest from the working thumb, and the minimap takes
     the other corner so the two never collide. */
  body.touch.mirror #sysbar{left:auto;right:calc(env(safe-area-inset-right) + 8px);}
  body.touch.mirror #mini{right:auto;left:calc(env(safe-area-inset-left) + 8px);}
  #sysbar button{min-width:44px;min-height:44px;font-size:11px;letter-spacing:1px;
    background:rgba(0,0,0,.6);}
  /* an Overlord is a set piece, and a set piece needs a health bar the player can
     read without looking away from the fight. It is a pure renderer read of the
     sim (G.enemies/e.hp), never a sim object. */
  #boss{position:fixed;left:50%;top:54px;transform:translateX(-50%);
    width:min(40vw,420px);z-index:4;pointer-events:none;
    background:rgba(12,7,7,.8);border:2px solid #7a2a2a;padding:6px 10px;
    color:#ddd;font-size:11px;letter-spacing:2px;}
  #boss.hidden{display:none;}
  #boss .bar{height:10px;background:#241010;border:1px solid #5a2020;margin-top:5px;}
  #boss .bar div{height:100%;width:100%;background:#e03020;}
  #boss.wounded .bar div{background:#ff7a30;}
  /* under ~580px the corner widgets eat the width, so the bar drops below the
     minimap instead of crossing it */
  @media (max-width:580px){
    #boss{top:186px;width:min(38vw,240px);}
  }
  .touchonly{display:none;}
  .val{font-size:22px;color:#ffd75e;font-weight:bold;text-shadow:0 0 6px #a60;}
  #faceCell{flex:1.4;background:#101010;}
  #face{height:90%;image-rendering:pixelated;}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.82);color:#ddd;z-index:10;text-align:center;cursor:pointer;}
  #ov.hidden{display:none;}
  .panel{border:3px solid #7a2a2a;background:rgba(12,7,7,.95);padding:26px 42px;
    box-shadow:0 0 50px rgba(255,40,20,.2);max-width:600px;}
  h1{font-size:46px;margin:0 0 4px;color:#e33;letter-spacing:4px;text-shadow:0 0 18px #a00;}
  h2{font-size:20px;margin:0 0 12px;color:#bbb;}
  .ctl{font-size:14px;line-height:1.8;color:#999;margin:12px 0 20px;}
  .ctl b{color:#eee;}
  .go{font-size:18px;color:#fff;animation:blink 1.1s steps(2) infinite;}
  .stat{font-size:16px;color:#ffd;line-height:1.8;margin:8px 0 16px;}
  @keyframes blink{50%{opacity:.25}}
  #mini{position:fixed;top:8px;right:8px;z-index:4;image-rendering:pixelated;
    border:2px solid #333;background:rgba(0,0,0,.55);display:none;}
  /* ---- the two-thumb control surface: a floating move stick + a fire pad ---- */
  #touchUI{position:fixed;inset:0;z-index:4;pointer-events:none;}
  #touchUI.hidden{display:none;}
  /* first-run legend: controls you cannot see are controls you cannot find */
  #tip{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:50%;
    transform:translateX(-50%);color:#9a9a9a;font-size:11px;letter-spacing:1px;
    background:rgba(0,0,0,.6);border:1px solid #333;padding:6px 12px;border-radius:6px;
    pointer-events:none;opacity:0;animation:tipfade 10s forwards 1.5s;max-width:92vw;}
  @keyframes tipfade{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
  .tstick{position:absolute;border:2px dashed rgba(255,215,94,.30);border-radius:50%;opacity:0;}
  .tstick.rest{opacity:.45;}
  .tstick.on{opacity:1;border-color:#ffd75e;background:rgba(255,215,94,.07);}
  .tstick .knob{position:absolute;left:50%;top:50%;width:22px;height:22px;border-radius:50%;
    background:#ffd75e;opacity:.5;}
  .tstick.on .knob{opacity:.9;box-shadow:0 0 10px rgba(255,215,94,.5);}
  .tstick.sprint{border-color:#ff5040;}
  .tstick.sprint .knob{background:#ff5040;box-shadow:0 0 12px rgba(255,60,40,.7);}
  /* the aim assist announces itself: an invisible nudge reads as the game
     steering on its own, and a player who can see it can trust it - or turn it off */
  .tstick.assist{border-color:#7dff6a;}
  .tstick.assist .knob{box-shadow:0 0 10px rgba(125,255,106,.45);}
  #firePad{position:absolute;width:66px;height:66px;border:2px solid #7a2a2a;border-radius:10px;
    background:rgba(122,42,42,.30);color:#ffd75e;font-size:11px;letter-spacing:2px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:auto;touch-action:none;}
  #firePad small{font-size:8px;color:#8a8a8a;letter-spacing:1px;}
  #firePad.down{background:rgba(255,60,40,.55);color:#fff;border-color:#ff5040;}
  /* options panel inside the title/pause panel: every touch assist is opt-in */
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .opts button{min-width:44px;min-height:44px;font-size:11px;letter-spacing:1px;}
  .opts button.off{color:#777;border-color:#333;}
  /* the title screen doubles as the level select: unlocked floors are buttons,
     locked ones read as a ladder the player has not climbed yet */
  .lvls{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .lvls button{min-width:44px;min-height:44px;font-size:12px;letter-spacing:1px;}
  .lvls button.sel{background:#3a2a10;border-color:#ffd75e;color:#ffd75e;}
  .lvls button:disabled{color:#555;border-color:#2a2a2a;background:#171717;cursor:default;}
  .best{font-size:12px;color:#8a8a8a;margin-top:8px;letter-spacing:1px;}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(180,0,0,.55) 100%);}
  #hit{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);color:#ff5040;
    font-size:30px;font-weight:bold;z-index:6;opacity:0;pointer-events:none;text-shadow:0 0 8px #f00;}
  #dmgdir{position:fixed;left:50%;top:50%;width:46vmin;height:46vmin;margin:-23vmin 0 0 -23vmin;
    border-radius:50%;border:10px solid transparent;border-top-color:rgba(255,40,30,.8);
    pointer-events:none;opacity:0;z-index:6;filter:blur(2px);}
</style>
</head>
<body>
<div id="wrap"></div>
<canvas id="mini" width="168" height="168"></canvas>
<div id="vig"></div>
<div id="hud" class="hidden">
  <div class="cell"><div class="lbl">HEALTH</div><div class="val" id="hHp">100</div></div>
  <div class="cell hudhide"><div class="lbl">ARMOR</div><div class="val" id="hArm" style="color:#7fb2ff;text-shadow:0 0 6px #26a">0</div></div>
  <div class="cell" id="faceCell"><canvas id="face" width="48" height="48"></canvas></div>
  <div class="cell"><div class="lbl">AMMO</div><div class="val" id="hAmmo">--</div></div>
  <div class="cell" id="gunCell"><div class="lbl">GUN</div><div class="val" id="hGun" style="font-size:14px">PISTOL</div></div>
  <div class="cell"><div class="lbl">KILLS</div><div class="val" id="hKills">0/10</div></div>
  <div class="cell hudhide"><div class="lbl">TIME</div><div class="val" id="hTime" style="font-size:16px">0:00</div></div>
  <div class="cell"><div class="lbl">SOUND</div><button id="sndBtn" title="toggle sound (V)">&#9835; ON</button></div>
</div>
<div id="sysbar">
  <button id="mapBtn" title="toggle map (M)">&#9635; MAP OFF</button>
  <button id="pauseBtn" title="pause (ESC)">&#9633; PAUSE</button>
</div>
<div id="boss" class="hidden"><span>OVERLORD</span><div class="bar"><div id="bossFill"></div></div></div>
<div id="touchUI" class="hidden">
  <div id="tip">LEFT THUMB drag to move &middot; RIGHT THUMB drag to turn &middot; FIRE hold to shoot</div>
  <!-- the sticks are drag surfaces, not buttons: a screen reader cannot drag them,
       so they are hidden from it and the FIRE pad carries the accessible label -->
  <div class="tstick" id="moveStick" aria-hidden="true"><div class="knob"></div></div>
  <div class="tstick" id="lookStick" aria-hidden="true"><div class="knob"></div></div>
  <div id="firePad" role="button" aria-label="Fire: hold to shoot, slide to turn">FIRE<small>hold / slide</small></div>
</div>
<div id="hit">+</div>
<!-- the panels are real dialogs: a keyboard user needs to know one is open and
     that the keys they press are answering it, not driving the hall -->
<div id="ov" role="dialog" aria-modal="true"><div class="panel" id="ovBox"></div></div>
<!-- data.js declares the GH namespace that art/audio/game/main all attach to,
     so it must come first. -->
<script src="lib/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/progress.js"></script>
<script src="js/secrets.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
<script>
  // A service worker needs a real origin: on file:// registration throws, so the
  // double-click-the-html workflow stays exactly as it was.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.warn('offline cache not installed:', err && err.message);
    });
  }
</script>
</body>
</html>
